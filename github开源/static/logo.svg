<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景网格（科技感） -->
  <line x1="0" y1="12" x2="22" y2="12" stroke="#2563eb" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="24" x2="16" y2="24" stroke="#2563eb" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="36" x2="22" y2="36" stroke="#2563eb" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="48" x2="16" y2="48" stroke="#2563eb" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="60" x2="22" y2="60" stroke="#2563eb" stroke-width="0.5" opacity="0.08"/>

  <!-- 六边形核心 -->
  <g filter="url(#shadow)">
    <!-- 底影层（最深，最大偏移） -->
    <polygon points="36,7 58,18 58,40 36,51 14,40 14,18"
             fill="#1e293b" opacity="0.08" transform="translate(2,3)"/>
    <!-- 阴影层（偏移） -->
    <polygon points="36,7 58,18 58,40 36,51 14,40 14,18"
             fill="#1d4ed8" opacity="0.3" transform="translate(1,1.5)"/>
    <!-- 主体（深色渐变） -->
    <polygon points="36,7 58,18 58,40 36,51 14,40 14,18"
             fill="url(#g3)"/>
    <!-- 高光层（浅色渐变，略缩） -->
    <polygon points="36,10 55,19 55,37 36,46 17,37 17,19"
             fill="url(#g2)" opacity="0.85"/>
    <!-- 顶面（最亮） -->
    <polygon points="36,12 53,20 53,36 36,44 19,36 19,20"
             fill="url(#g1)"/>
  </g>

  <!-- 左上高光 -->
  <polygon points="36,12 53,20 42,25 25,17" fill="#fff" opacity="0.15"/>
  <!-- 右边缘光 -->
  <line x1="53" y1="20" x2="53" y2="36" stroke="#60a5fa" stroke-width="0.8" opacity="0.3"/>

  <!-- 内六边形镂空 -->
  <polygon points="36,18 49,24 49,32 36,38 23,32 23,24"
           fill="#fff" opacity="0.9"/>
  <polygon points="36,18 49,24 49,32 36,38 23,32 23,24"
           fill="url(#g3)" opacity="0.06"/>

  <!-- 中心发光点 -->
  <circle cx="36" cy="28" r="2" fill="#2563eb" opacity="0.8" filter="url(#glow)"/>

  <!-- 电路线（科技感） -->
  <path d="M14 28 L8 28 L8 22 L4 22" stroke="#2563eb" stroke-width="1.2" opacity="0.25"/>
  <circle cx="4" cy="22" r="1.5" fill="#2563eb" opacity="0.2"/>
  <path d="M14 36 L6 36 L6 42 L2 42" stroke="#2563eb" stroke-width="1.2" opacity="0.2"/>
  <path d="M58 22 L66 22 L66 16 L70 16" stroke="#7c3aed" stroke-width="1.2" opacity="0.25"/>
  <circle cx="70" cy="16" r="1.5" fill="#7c3aed" opacity="0.2"/>
  <circle cx="70" cy="16" r="3" fill="#7c3aed" opacity="0.06"/>

  <!-- 电路节点 -->
  <circle cx="8" cy="28" r="1" fill="#2563eb" opacity="0.15"/>
  <circle cx="6" cy="36" r="1" fill="#2563eb" opacity="0.15"/>
  <circle cx="66" cy="22" r="1" fill="#7c3aed" opacity="0.15"/>

  <!-- 文字部分 -->
  <!-- 主标题 CAD 插件 -->
  <text x="86" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="26" font-weight="800" fill="url(#g3)" letter-spacing="2">CAD 插件</text>

  <!-- 主标题阴影 -->
  <text x="86" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="26" font-weight="800" fill="#7c3aed" letter-spacing="2" opacity="0.06" transform="translate(1,1)">CAD 插件</text>

  <!-- 副标题 -->
  <text x="86" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="4">PLUGIN PLATFORM</text>

  <!-- 文字下方装饰线 -->
  <line x1="86" y1="60" x2="210" y2="60" stroke="url(#g1)" stroke-width="1.5" opacity="0.12" stroke-linecap="round"/>
  <line x1="86" y1="60" x2="120" y2="60" stroke="url(#g1)" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
</svg>
