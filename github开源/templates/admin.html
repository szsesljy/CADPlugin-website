<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - CAD 插件平台</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <span class="nav-logo">
                <img src="/static/logo.svg" alt="管理后台" class="nav-logo-img" style="height:28px;">
            </span>
            <div class="nav-links">
                <a href="/" class="nav-btn" target="_blank">查看前台</a>
                <button class="nav-btn nav-btn-outline" onclick="showPasswordForm()">修改密码</button>
                <a href="/admin/logout" class="nav-btn nav-btn-outline">退出登录</a>
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="container">
            <!-- 统计卡片：插件数据 -->
            <div class="stats-row">
                <div class="stat-card stat-card-plugin"><span class="stat-num">{{ stats.total }}</span><span class="stat-label">总计</span></div>
                <div class="stat-card stat-card-plugin"><span class="stat-num">{{ stats.approved }}</span><span class="stat-label">已审核</span></div>
                <div class="stat-card stat-card-plugin"><span class="stat-num">{{ stats.pending }}</span><span class="stat-label">待审核</span></div>
                <div class="stat-card stat-card-plugin"><span class="stat-num">{{ stats.downloads }}</span><span class="stat-label">总下载</span></div>
            </div>
            <!-- 统计卡片：访问数据 -->
            <div class="stats-divider"></div>
            <div class="stats-row">
                <div class="stat-card stat-card-visit"><span class="stat-num">{{ views.total }}</span><span class="stat-label">总访问</span></div>
                <div class="stat-card stat-card-visit"><span class="stat-num">{{ views.today }}</span><span class="stat-label">今日访问</span></div>
                <div class="stat-card stat-card-visit"><span class="stat-num">{{ views.yesterday }}</span><span class="stat-label">昨日访问</span></div>
            </div>

            <!-- Tabs -->
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="pending" onclick="switchTab('pending')">待审核</button>
                <button class="admin-tab" data-tab="approved" onclick="switchTab('approved')">已审核</button>
                <button class="admin-tab" data-tab="upload" onclick="switchTab('upload')">直接上传</button>
                <button class="admin-tab" data-tab="categories" onclick="switchTab('categories')">分类管理</button>
                <button class="admin-tab" data-tab="donation" onclick="switchTab('donation')">打赏设置</button>
                <button class="admin-tab" data-tab="articles" onclick="switchTab('articles')">文章管理</button>
                <button class="admin-tab" data-tab="messages" onclick="switchTab('messages')">留言管理</button>
            </div>

            <!-- 待审核面板 -->
            <div class="admin-panel active" id="panel-pending">
                <div class="panel-toolbar">
                    <button class="btn btn-sm btn-success" onclick="batchApprove()">批量通过</button>
                    <button class="btn btn-sm btn-danger" onclick="batchReject()">批量拒绝</button>
                </div>
                <div id="pending-list"><p class="text-muted">加载中...</p></div>
            </div>

            <!-- 已审核面板 -->
            <div class="admin-panel" id="panel-approved">
                <div class="panel-toolbar">
                    <input class="form-input search-input-inline" id="approvedSearch" placeholder="搜索已审核插件..." oninput="loadApproved()">
                </div>
                <div id="approved-list"><p class="text-muted">加载中...</p></div>
            </div>

            <!-- 直接上传面板 -->
            <div class="admin-panel" id="panel-upload">
                <h2 class="section-title">直接上传（跳过审核）</h2>
                <form id="directUploadForm" class="upload-form" enctype="multipart/form-data">
                    <div class="form-group">
                        <input class="form-input" type="text" id="du_name" placeholder="插件名称" required>
                    </div>
                    <div class="form-group">
                        <textarea class="form-input form-textarea" id="du_desc" rows="2" placeholder="描述"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <input class="form-input" type="text" id="du_ver" value="1.0" placeholder="版本">
                        </div>
                        <div class="form-group">
                            <input class="form-input" type="text" id="du_author" value="匿名" placeholder="作者">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">行业用途</label>
                        <div id="du_tags" class="category-picker"></div>
                    </div>
                    <div class="form-group">
                        <input class="form-file" type="file" id="du_file" required>
                    </div>
                    <button class="btn btn-primary" type="submit">直接上传</button>
                </form>
            </div>

            <!-- 分类管理面板 -->
            <div class="admin-panel" id="panel-categories">
                <div class="panel-toolbar">
                    <button class="btn btn-sm btn-primary" onclick="addCategory()">新增行业</button>
                </div>
                <div id="categories-list"><p class="text-muted">加载中...</p></div>
            </div>

            <!-- 打赏设置面板 -->
            <div class="admin-panel" id="panel-donation">
                <div class="donation-section">
                    <h2 class="section-title">收款码</h2>
                    <form id="qrcodeForm" class="upload-form" enctype="multipart/form-data">
                        <div class="form-group">
                            <label class="form-label">选择收款码图片（JPG / PNG）</label>
                            <input class="form-file" type="file" id="qrcodeFile" name="file" accept=".jpg,.jpeg,.png" required>
                        </div>
                        <button class="btn btn-primary" type="submit">上传</button>
                    </form>
                    <div id="qrcodePreview" class="qrcode-preview" style="display:none;">
                        <h3 class="section-title">当前收款码</h3>
                        <img id="qrcodeImg" src="" alt="收款码">
                        <button class="btn btn-danger" onclick="deleteQrcode()">删除收款码</button>
                    </div>
                    <div class="donation-toggle">
                        <label class="toggle-label">
                            <input type="checkbox" id="donationEnabled" onchange="toggleDonation()">
                            前台显示打赏按钮
                        </label>
                    </div>
                </div>
            </div>

            <!-- 文章管理面板 -->
            <div class="admin-panel" id="panel-articles">
                <div class="panel-toolbar">
                    <button class="btn btn-sm btn-primary" onclick="showArticleModal()">写文章</button>
                </div>
                <div id="articles-list"><p class="text-muted">加载中...</p></div>
            </div>

            <!-- 留言管理面板 -->
            <div class="admin-panel" id="panel-messages">
                <div class="panel-toolbar">
                    <button class="btn btn-sm btn-success" onclick="batchApproveMessages()">批量通过</button>
                    <button class="btn btn-sm btn-danger" onclick="batchRejectMessages()">批量拒绝</button>
                    <select class="form-input" style="max-width:150px;padding:6px 10px;font-size:13px;margin-left:auto;" id="msgFilter" onchange="loadMessages()">
                        <option value="pending">待审核</option>
                        <option value="approved">已通过</option>
                        <option value="rejected">已拒绝</option>
                        <option value="all">全部</option>
                    </select>
                </div>
                <div id="messages-list"><p class="text-muted">加载中...</p></div>
            </div>
        </div>
    </main>

    <!-- 编辑插件弹窗 -->
    <div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeEdit()">
        <div class="modal-box" style="max-width:600px;text-align:left;max-height:80vh;overflow-y:auto;">
            <h3 class="section-title">编辑插件</h3>
            <div class="form-group"><input class="form-input" id="edit_name" placeholder="名称"></div>
            <div class="form-group"><textarea class="form-input form-textarea" id="edit_desc" rows="2" placeholder="描述"></textarea></div>
            <div class="form-row">
                <div class="form-group"><input class="form-input" id="edit_ver" placeholder="版本"></div>
                <div class="form-group"><input class="form-input" id="edit_author" placeholder="作者"></div>
            </div>
            <div class="form-group">
                <label class="form-label">标签</label>
                <div id="edit_tags" class="category-picker"></div>
            </div>
            <div class="form-row">
                <button class="btn btn-primary" onclick="saveEdit()">保存</button>
                <button class="btn" style="background:#e2e8f0;color:#1e293b;" onclick="closeEdit()">取消</button>
            </div>
        </div>
    </div>

    <!-- 文章编辑弹窗 -->
    <div class="modal-overlay" id="articleModal" onclick="if(event.target===this)closeArticleModal()">
        <div class="modal-box" style="max-width:600px;text-align:left;max-height:80vh;overflow-y:auto;">
            <h3 class="section-title" id="articleModalTitle">写文章</h3>
            <div class="form-group">
                <select class="form-input" id="art_type">
                    <option value="notice">通知</option>
                    <option value="guide">使用说明</option>
                </select>
            </div>
            <div class="form-group"><input class="form-input" id="art_title" placeholder="标题"></div>
            <div class="form-group"><textarea class="form-input form-textarea" id="art_content" rows="8" placeholder="内容..."></textarea></div>
            <div class="form-group">
                <label class="form-label">关联插件（仅使用说明）</label>
                <input class="form-input" id="art_plugin_search" placeholder="搜索插件..." oninput="filterPluginOptions()">
                <select class="form-input" id="art_plugin_id" size="8" style="margin-top:6px;"><option value="">无</option></select>
            </div>
            <div class="form-group">
                <label class="toggle-label">
                    <input type="checkbox" id="art_pinned">
                    置顶
                </label>
            </div>
            <div class="form-row">
                <button class="btn btn-primary" onclick="saveArticle()">保存</button>
                <button class="btn" style="background:#e2e8f0;color:#1e293b;" onclick="closeArticleModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        let editingId = null;
        let allCategories = [];

        // ── Tab ──
        function switchTab(name) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`.admin-tab[data-tab="${name}"]`).classList.add('active');
            document.getElementById(`panel-${name}`).classList.add('active');
            if (name === 'pending') loadPending();
            if (name === 'approved') loadApproved();
            if (name === 'categories') loadCategories();
            if (name === 'articles') loadArticles();
            if (name === 'upload') loadTagCheckboxes('du_tags');
            if (name === 'messages') loadMessages();
        }

        // ── Load Categories ──
        async function fetchCategories() {
            const res = await fetch('/admin/api/categories');
            allCategories = await res.json();
            return allCategories;
        }

        function loadTagCheckboxes(containerId, selectedIds = []) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            allCategories.forEach(cat => {
                const g = document.createElement('div');
                g.className = 'cat-group';
                g.innerHTML = `<div class="cat-group-title">${cat.name}</div><div class="cat-tags">`;
                cat.tags.forEach(t => {
                    const checked = selectedIds.includes(t.id) ? 'checked' : '';
                    g.innerHTML += `<label class="cat-tag"><input type="checkbox" value="${t.id}" ${checked}><span>${t.name}</span></label>`;
                });
                container.appendChild(g);
            });
        }

        // ── Pending ──
        async function loadPending() {
            const el = document.getElementById('pending-list');
            try {
                const res = await fetch('/admin/api/pending');
                if (res.status === 401) { window.location.href = '/admin/login'; return; }
                const data = await res.json();
                if (!data.length) { el.innerHTML = '<p class="text-muted">暂无待审核插件</p>'; return; }
                let html = `<table class="admin-table"><thead><tr><th><input type="checkbox" onchange="toggleAll(this,'pending-check')"></th><th>名称</th><th>作者</th><th>大小</th><th>类型</th><th>时间</th><th>操作</th></tr></thead><tbody>`;
                for (const p of data) {
                    const ext = p.file_name.split('.').pop().toUpperCase();
                    const size = p.file_size > 1048576 ? (p.file_size/1048576).toFixed(1)+' MB' : (p.file_size/1024).toFixed(1)+' KB';
                    html += `<tr><td><input type="checkbox" class="pending-check" value="${p.id}"></td>
                        <td><strong>${p.name}</strong></td><td>${p.author}</td><td>${size}</td><td><span class="mini-badge">${ext}</span></td>
                        <td>${p.created_at}</td>
                        <td class="action-cell"><button class="btn btn-sm btn-success" onclick="approve(${p.id})">通过</button>
                        <button class="btn btn-sm btn-danger" onclick="reject(${p.id})">拒绝</button></td></tr>`;
                }
                html += '</tbody></table>';
                el.innerHTML = html;
            } catch(e) { el.innerHTML = '<p class="text-muted">加载失败</p>'; }
        }

        function toggleAll(master, cls) {
            document.querySelectorAll(`.${cls}`).forEach(c => c.checked = master.checked);
        }
        function getSelectedIds(cls) {
            return [...document.querySelectorAll(`.${cls}:checked`)].map(c => parseInt(c.value));
        }
        async function approve(id) {
            const res = await fetch(`/admin/api/approve/${id}`, {method:'POST'});
            const data = await res.json();
            if (data.scan_warning) {
                alert(`扫描提醒: ${data.scan_warning}\n\n插件已通过，建议确认后再发布。`);
            }
            loadPending();
        }
        async function reject(id) { if (!confirm('拒绝此插件？')) return; await fetch(`/admin/api/reject/${id}`, {method:'POST'}); loadPending(); }
        async function batchApprove() {
            const ids = getSelectedIds('pending-check');
            if (!ids.length) return alert('请选择插件');
            await fetch('/admin/api/batch-approve', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids})});
            loadPending();
        }
        async function batchReject() {
            const ids = getSelectedIds('pending-check');
            if (!ids.length) return alert('请选择插件');
            if (!confirm(`确定拒绝 ${ids.length} 个插件？`)) return;
            await fetch('/admin/api/batch-reject', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids})});
            loadPending();
        }

        // ── Approved ──
        async function loadApproved() {
            const el = document.getElementById('approved-list');
            const q = document.getElementById('approvedSearch').value;
            try {
                const res = await fetch(`/admin/api/approved?search=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (!data.plugins.length) { el.innerHTML = '<p class="text-muted">暂无已审核插件</p>'; return; }
                let html = `<table class="admin-table"><thead><tr><th>名称</th><th>作者</th><th>状态</th><th>下载</th><th>时间</th><th>操作</th></tr></thead><tbody>`;
                for (const p of data.plugins) {
                    const status = p.disabled ? '<span class="mini-badge" style="background:#fef2f2;color:#991b1b;">已下架</span>' : '<span class="mini-badge" style="background:#f0fdf4;color:#166534;">正常</span>';
                    html += `<tr><td><strong>${p.name}</strong></td><td>${p.author}</td><td>${status}</td>
                        <td>${p.downloads}</td><td>${p.created_at}</td>
                        <td class="action-cell">
                            <button class="btn btn-sm" style="background:#2563eb;color:#fff;" onclick="editPlugin(${p.id},'${p.name.replace(/'/g,"\\'")}','${p.description.replace(/'/g,"\\'")}','${p.version}','${p.author.replace(/'/g,"\\'")}')">编辑</button>
                            <button class="btn btn-sm" style="background:#f59e0b;color:#fff;" onclick="toggleDisable(${p.id},${p.disabled})">${p.disabled?'上架':'下架'}</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteApproved(${p.id})">删除</button>
                        </td></tr>`;
                }
                el.innerHTML = html;
            } catch(e) { el.innerHTML = '<p class="text-muted">加载失败</p>'; }
        }

        async function toggleDisable(id, current) {
            await fetch(`/admin/api/approved/${id}/toggle-disable`, {method:'POST'});
            loadApproved();
        }

        async function deleteApproved(id) {
            if (!confirm('确定删除此插件？文件和数据将不可恢复。')) return;
            await fetch(`/admin/api/approved/${id}`, {method:'DELETE'});
            loadApproved();
        }

        // ── Edit Plugin ──
        async function editPlugin(id, name, desc, ver, author) {
            editingId = id;
            document.getElementById('edit_name').value = name;
            document.getElementById('edit_desc').value = desc;
            document.getElementById('edit_ver').value = ver;
            document.getElementById('edit_author').value = author;
            await fetchCategories();
            // Fetch current tags
            const res = await fetch(`/admin/api/approved`); // simplify: just show all
            loadTagCheckboxes('edit_tags', []);
            document.getElementById('editModal').classList.add('active');
        }

        async function saveEdit() {
            if (!editingId) return;
            const tagCheckboxes = document.querySelectorAll('#edit_tags input[type="checkbox"]:checked');
            const tagIds = [...tagCheckboxes].map(c => parseInt(c.value));
            await fetch(`/admin/api/approved/${editingId}/edit`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('edit_name').value,
                    description: document.getElementById('edit_desc').value,
                    version: document.getElementById('edit_ver').value,
                    author: document.getElementById('edit_author').value,
                    tag_ids: tagIds,
                })
            });
            closeEdit();
            loadApproved();
        }

        function closeEdit() {
            editingId = null;
            document.getElementById('editModal').classList.remove('active');
        }

        // ── Direct Upload ──
        document.getElementById('directUploadForm')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            const fd = new FormData();
            fd.append('name', document.getElementById('du_name').value);
            fd.append('description', document.getElementById('du_desc').value);
            fd.append('version', document.getElementById('du_ver').value);
            fd.append('author', document.getElementById('du_author').value);
            const tagCheckboxes = document.querySelectorAll('#du_tags input[type="checkbox"]:checked');
            fd.append('tag_ids', [...tagCheckboxes].map(c=>c.value).join(','));
            fd.append('file', document.getElementById('du_file').files[0]);
            const res = await fetch('/admin/api/direct-upload', {method:'POST', body:fd});
            if (res.ok) {
                alert('上传成功！');
                this.reset();
            } else {
                const data = await res.json();
                alert(data.error || '上传失败');
            }
        });

        // ── Categories Management ──
        async function loadCategories() {
            const el = document.getElementById('categories-list');
            await fetchCategories();
            if (!allCategories.length) { el.innerHTML = '<p class="text-muted">暂无分类</p>'; return; }
            let html = '';
            for (const cat of allCategories) {
                html += `<div class="cat-mgr-group">
                    <div class="cat-mgr-header">
                        <strong>${cat.name}</strong>
                        <div>
                            <button class="btn btn-sm" style="background:#2563eb;color:#fff;" onclick="addTag(${cat.id})">+ 标签</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCat(${cat.id})">删除</button>
                        </div>
                    </div>
                    <div class="cat-mgr-tags">`;
                for (const t of cat.tags) {
                    html += `<span class="cat-mgr-tag">${t.name} <a href="#" onclick="event.preventDefault();deleteTag(${t.id})" style="color:#ef4444;margin-left:6px;">x</a></span>`;
                }
                html += `</div></div>`;
            }
            el.innerHTML = html;
        }

        async function addCategory() {
            const name = prompt('输入行业名称：');
            if (!name) return;
            await fetch('/admin/api/categories', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
            loadCategories();
        }
        async function deleteCat(id) {
            if (!confirm('删除行业会同时删除其下所有标签，确定？')) return;
            await fetch(`/admin/api/categories/${id}`, {method:'DELETE'});
            loadCategories();
        }
        async function addTag(catId) {
            const name = prompt('输入标签名称：');
            if (!name) return;
            await fetch(`/admin/api/categories/${catId}/tags`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
            loadCategories();
        }
        async function deleteTag(id) {
            await fetch(`/admin/api/tags/${id}`, {method:'DELETE'});
            loadCategories();
        }

        // ── Donation ──
        const donationData = {{ donation | tojson | safe }};
        if (donationData && donationData.qrcode_path) {
            document.getElementById('qrcodePreview').style.display = 'block';
            document.getElementById('qrcodeImg').src = '/donation/qrcode?' + Date.now();
            document.getElementById('donationEnabled').checked = donationData.enabled === 1;
        }
        document.getElementById('qrcodeForm')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            const fd = new FormData(this);
            const res = await fetch('/admin/api/donation', {method:'POST', body:fd});
            if (res.ok) {
                document.getElementById('qrcodePreview').style.display = 'block';
                document.getElementById('qrcodeImg').src = '/donation/qrcode?' + Date.now();
                document.getElementById('donationEnabled').checked = true;
                alert('收款码已更新');
            } else {
                const data = await res.json();
                alert(data.error || '上传失败');
            }
        });
        async function deleteQrcode() {
            if (!confirm('确定删除收款码？')) return;
            const res = await fetch('/admin/api/donation', {method:'DELETE'});
            if (res.ok) {
                document.getElementById('qrcodePreview').style.display = 'none';
                document.getElementById('donationEnabled').checked = false;
            }
        }
        async function toggleDonation() {
            const enabled = document.getElementById('donationEnabled').checked;
            await fetch('/admin/api/donation/toggle', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled})});
        }

        // ── Articles Management ──
        let editingArticleId = null;

        async function loadArticles() {
            const el = document.getElementById('articles-list');
            try {
                const res = await fetch('/admin/api/articles');
                const data = await res.json();
                if (!data.length) { el.innerHTML = '<p class="text-muted">暂无文章</p>'; return; }
                let html = `<table class="admin-table"><thead><tr><th>类型</th><th>标题</th><th>关联插件</th><th>置顶</th><th>时间</th><th>操作</th></tr></thead><tbody>`;
                for (const a of data) {
                    const typeLabel = a.type === 'notice'
                        ? '<span class="mini-badge" style="background:#dbeafe;color:#1e40af;">通知</span>'
                        : '<span class="mini-badge" style="background:#f0fdf4;color:#166534;">说明</span>';
                    const pinnedLabel = a.pinned ? '<span class="mini-badge" style="background:#fef3c7;color:#b45309;">置顶</span>' : '-';
                    html += `<tr><td>${typeLabel}</td><td><strong>${a.title}</strong></td>
                        <td>${a.plugin_name || '-'}</td><td>${pinnedLabel}</td><td>${a.created_at}</td>
                        <td class="action-cell">
                            <button class="btn btn-sm" style="background:#2563eb;color:#fff;" onclick="editArticle(${a.id})">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteArticle(${a.id})">删除</button>
                        </td></tr>`;
                }
                el.innerHTML = html;
            } catch(e) { el.innerHTML = '<p class="text-muted">加载失败</p>'; }
        }

        async function showArticleModal() {
            editingArticleId = null;
            document.getElementById('articleModalTitle').textContent = '写文章';
            document.getElementById('art_type').value = 'notice';
            document.getElementById('art_title').value = '';
            document.getElementById('art_content').value = '';
            document.getElementById('art_plugin_id').value = '';
            document.getElementById('art_pinned').checked = false;
            await loadPluginSelect();
            document.getElementById('articleModal').classList.add('active');
        }

        async function loadPluginSelect() {
            const res = await fetch('/admin/api/approved?grouped=true');
            const data = await res.json();
            const select = document.getElementById('art_plugin_id');
            // Store full data for search filtering
            select._data = data;
            renderPluginOptions(data, '');
        }

        function renderPluginOptions(data, searchText) {
            const select = document.getElementById('art_plugin_id');
            const q = searchText.toLowerCase();
            let html = '<option value="">无</option>';
            for (const cat of data.categories) {
                const catPlugins = data.plugins.filter(p =>
                    p.tags.some(t => t.category_id === cat.id) &&
                    (!q || p.name.toLowerCase().includes(q) || p.author.toLowerCase().includes(q))
                );
                if (catPlugins.length === 0 && q) continue;
                if (!q) {
                    html += `<optgroup label="${cat.name}">`;
                    for (const p of catPlugins) {
                        html += `<option value="${p.id}">${p.name} (${p.author})</option>`;
                    }
                    html += '</optgroup>';
                } else {
                    // In search mode, show matching plugins under category headers without optgroup
                    html += `<option disabled style="background:#f1f5f9;font-weight:600;color:#475569;">── ${cat.name} ──</option>`;
                    for (const p of catPlugins) {
                        html += `<option value="${p.id}">${p.name} (${p.author})</option>`;
                    }
                }
            }
            // Uncategorized plugins
            const uncat = data.plugins.filter(p =>
                (!p.tags || p.tags.length === 0) &&
                (!q || p.name.toLowerCase().includes(q) || p.author.toLowerCase().includes(q))
            );
            if (uncat.length > 0) {
                const label = q ? '── 未分类 ──' : '未分类';
                html += `<optgroup label="${label}">`;
                for (const p of uncat) {
                    html += `<option value="${p.id}">${p.name} (${p.author})</option>`;
                }
                html += '</optgroup>';
            }
            select.innerHTML = html;
        }

        function filterPluginOptions() {
            const q = document.getElementById('art_plugin_search').value;
            const select = document.getElementById('art_plugin_id');
            if (select._data) {
                renderPluginOptions(select._data, q);
            }
        }

        async function saveArticle() {
            const body = {
                type: document.getElementById('art_type').value,
                title: document.getElementById('art_title').value,
                content: document.getElementById('art_content').value,
                plugin_id: document.getElementById('art_plugin_id').value || null,
                pinned: document.getElementById('art_pinned').checked,
            };
            if (!body.title) return alert('标题不能为空');
            if (editingArticleId) {
                await fetch(`/admin/api/articles/${editingArticleId}`, {
                    method:'PUT',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify(body),
                });
            } else {
                await fetch('/admin/api/articles', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify(body),
                });
            }
            closeArticleModal();
            loadArticles();
        }

        async function editArticle(id) {
            editingArticleId = id;
            document.getElementById('articleModalTitle').textContent = '编辑文章';
            try {
                const res = await fetch(`/admin/api/articles/${id}`);
                const a = await res.json();
                document.getElementById('art_type').value = a.type;
                document.getElementById('art_title').value = a.title;
                document.getElementById('art_content').value = a.content;
                document.getElementById('art_pinned').checked = a.pinned === 1;
                await loadPluginSelect();
                if (a.plugin_id) document.getElementById('art_plugin_id').value = a.plugin_id;
                document.getElementById('articleModal').classList.add('active');
            } catch(e) { alert('加载失败'); }
        }

        async function deleteArticle(id) {
            if (!confirm('确定删除此文章？')) return;
            await fetch(`/admin/api/articles/${id}`, {method:'DELETE'});
            loadArticles();
        }

        function closeArticleModal() {
            editingArticleId = null;
            document.getElementById('articleModal').classList.remove('active');
        }

        // ── Messages Management ──
        async function loadMessages() {
            const el = document.getElementById('messages-list');
            const filter = document.getElementById('msgFilter').value;
            try {
                const res = await fetch(`/admin/api/messages?status=${filter}`);
                const data = await res.json();
                if (!data.length) { el.innerHTML = '<p class="text-muted">暂无留言</p>'; return; }
                let html = `<table class="admin-table"><thead><tr><th><input type="checkbox" onchange="toggleAll(this,'msg-check')"></th><th>插件</th><th>用户</th><th>内容</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody>`;
                for (const m of data) {
                    const statusLabel = m.status === 'approved'
                        ? '<span class="mini-badge" style="background:#f0fdf4;color:#166534;">已通过</span>'
                        : m.status === 'rejected'
                        ? '<span class="mini-badge" style="background:#fef2f2;color:#991b1b;">已拒绝</span>'
                        : '<span class="mini-badge" style="background:#fef3c7;color:#b45309;">待审核</span>';
                    html += `<tr><td><input type="checkbox" class="msg-check" value="${m.id}"></td>
                        <td>${m.plugin_name || '全站'}</td><td>${m.author}</td>
                        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${m.content.replace(/"/g,'&quot;')}">${m.content}</td>
                        <td>${m.created_at}</td><td>${statusLabel}</td>
                        <td class="action-cell">`;
                    if (m.status === 'pending') {
                        html += `<button class="btn btn-sm btn-success" onclick="approveMsg(${m.id})">通过</button>
                            <button class="btn btn-sm btn-danger" onclick="rejectMsg(${m.id})">拒绝</button>`;
                    }
                    html += `<button class="btn btn-sm" style="background:#ef4444;color:#fff;" onclick="deleteMsg(${m.id})">删除</button>`;
                    html += `</td></tr>`;
                }
                html += '</tbody></table>';
                el.innerHTML = html;
            } catch(e) { el.innerHTML = '<p class="text-muted">加载失败</p>'; }
        }

        async function approveMsg(id) { await fetch(`/admin/api/messages/${id}/approve`, {method:'POST'}); loadMessages(); }
        async function rejectMsg(id) { await fetch(`/admin/api/messages/${id}/reject`, {method:'POST'}); loadMessages(); }
        async function deleteMsg(id) { if (!confirm('确定删除？')) return; await fetch(`/admin/api/messages/${id}`, {method:'DELETE'}); loadMessages(); }

        async function batchApproveMessages() {
            const ids = getSelectedIds('msg-check');
            if (!ids.length) return alert('请选择留言');
            await fetch('/admin/api/messages/batch-approve', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids})});
            loadMessages();
        }

        async function batchRejectMessages() {
            const ids = getSelectedIds('msg-check');
            if (!ids.length) return alert('请选择留言');
            if (!confirm(`确定拒绝 ${ids.length} 条留言？`)) return;
            await fetch('/admin/api/messages/batch-reject', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids})});
            loadMessages();
        }

        // ── 密码修改 ──
        function showPasswordForm() {
            const html = `
                <div id="passwordOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:999;display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this)closePasswordForm()">
                    <div style="background:#fff;border-radius:14px;padding:28px;width:380px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,0.15);">
                        <h3 style="margin:0 0 16px;font-size:18px;">修改管理员密码</h3>
                        <div class="form-group"><input class="form-input" type="password" id="pwOld" placeholder="原密码" style="width:100%;"></div>
                        <div class="form-group"><input class="form-input" type="password" id="pwNew" placeholder="新密码（至少 6 位）" style="width:100%;"></div>
                        <div class="form-group"><input class="form-input" type="password" id="pwConfirm" placeholder="确认新密码" style="width:100%;"></div>
                        <div id="pwError" style="color:#dc2626;font-size:13px;margin-bottom:10px;display:none;"></div>
                        <div style="display:flex;gap:8px;justify-content:flex-end;">
                            <button class="btn btn-sm" onclick="closePasswordForm()">取消</button>
                            <button class="btn btn-sm btn-primary" onclick="changePassword()">保存</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
            document.getElementById('pwOld').focus();
        }
        function closePasswordForm() {
            const el = document.getElementById('passwordOverlay');
            if (el) el.remove();
        }
        async function changePassword() {
            const oldPw = document.getElementById('pwOld').value;
            const newPw = document.getElementById('pwNew').value;
            const confirmPw = document.getElementById('pwConfirm').value;
            const errEl = document.getElementById('pwError');
            if (!oldPw || !newPw || !confirmPw) {
                errEl.textContent = '请填写完整'; errEl.style.display = '';
                return;
            }
            if (newPw !== confirmPw) {
                errEl.textContent = '两次密码不一致'; errEl.style.display = '';
                return;
            }
            if (newPw.length < 6) {
                errEl.textContent = '新密码至少 6 位'; errEl.style.display = '';
                return;
            }
            try {
                const r = await fetch('/admin/api/change-password', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({old_password: oldPw, new_password: newPw}),
                });
                const data = await r.json();
                if (data.error) {
                    errEl.textContent = data.error; errEl.style.display = '';
                } else {
                    alert('密码修改成功！');
                    closePasswordForm();
                }
            } catch(e) {
                errEl.textContent = '请求失败'; errEl.style.display = '';
            }
        }

        // ── Init ──
        fetchCategories().then(() => { loadPending(); });
    </script>
</body>
</html>
