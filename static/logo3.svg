<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- 三角尺 -->
  <polygon points="20,95 95,95 95,20"
           fill="#2563eb" opacity="0.08" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <!-- 三角尺刻度线 -->
  <line x1="40" y1="95" x2="95" y2="40" stroke="#2563eb" stroke-width="1.5" opacity="0.3"/>
  <line x1="55" y1="95" x2="95" y2="55" stroke="#2563eb" stroke-width="1.5" opacity="0.3"/>
  <line x1="70" y1="95" x2="95" y2="70" stroke="#2563eb" stroke-width="1.5" opacity="0.3"/>

  <!-- 方块阵列（代表插件模块） -->
  <rect x="18" y="14" width="22" height="22" rx="4"
        fill="#2563eb" opacity="0.85"/>
  <rect x="46" y="14" width="22" height="22" rx="4"
        fill="#2563eb" opacity="0.6"/>
  <rect x="32" y="42" width="22" height="22" rx="4"
        fill="#2563eb" opacity="0.35"/>
</svg>
